[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blackheart"
version = "1.1.0"
description = "Attacker-driven smart-contract and pallet security research and exploit-verification engine"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "BLACKHEART contributors"}]
keywords = ["security", "smart-contracts", "solidity", "substrate", "fuzzing", "sarif", "bounty"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/itzebe/blackheart"
Repository = "https://github.com/itzebe/blackheart"
Issues = "https://github.com/itzebe/blackheart/issues"
Documentation = "https://github.com/itzebe/blackheart/blob/main/docs/QUICKSTART.md"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "pyyaml>=6", "ruff>=0.5", "mypy>=1.10", "pytest-cov>=5"]
gha = ["pyyaml>=6"]

[project.scripts]
blackheart = "blackheart.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["blackheart*"]

[tool.setuptools.package-data]
# The pinned toolchain manifest must travel with the package: `blackheart
# engines bootstrap` reads it from disk at runtime.
"blackheart.engines" = ["toolchain.json"]
"blackheart" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end benchmarks and real engine scans (run with -m slow)",
    "live: executes a real external engine binary (skips when not installed)",
    "network: reaches a public API (excluded by default; run with -m network)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741", "E701", "E702", "E731"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
ignore_missing_imports = true
# Ratchet: these modules still have type debt (443 errors when the gate was added,
# 2026-11-26). ignore_errors grandfathers them so the gate blocks NEW errors in the
# other 269 files. Shrink this list as modules are typed; never grow it silently.
[[tool.mypy.overrides]]
module = [
    "blackheart.adversarial",
    "blackheart.assurance.mutation",
    "blackheart.assurance.portfolio",
    "blackheart.authz.scope_matcher",
    "blackheart.campaign",
    "blackheart.chrome.harness",
    "blackheart.cli",
    "blackheart.cloud",
    "blackheart.coverage_engine.controller",
    "blackheart.dataflow.ssa",
    "blackheart.demo_p2p3",
    "blackheart.deployed_multicontract",
    "blackheart.discovery.blind_benchmark",
    "blackheart.discovery.certify",
    "blackheart.discovery.harness",
    "blackheart.doctrine",
    "blackheart.dossier",
    "blackheart.engines.contract",
    "blackheart.engines.orchestrator",
    "blackheart.engines.pentagi",
    "blackheart.engines.session",
    "blackheart.engines.shannon",
    "blackheart.engines.solidity.echidna",
