name: engines-live

# Expensive: installs the real Solidity toolchain and runs every engine against
# the adversarial harness. Kept out of ordinary CI so a normal pull request does
# not download fuzzers and solvers, but available on demand and weekly so the
# live path cannot rot unnoticed.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package
        run: python -m pip install -e ".[dev]"
      - name: Install Foundry (crytic-compile needs forge to compile a target)
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          ~/.foundry/bin/foundryup
      - name: Bootstrap the pinned engine toolchain
        run: python -m blackheart engines bootstrap
      - name: Doctor must now pass
        run: python -m blackheart engines doctor
      - name: Live engine tests (a skip is a failure here)
        env:
          BLACKHEART_LIVE_ENGINES: "1"
        run: python -m pytest tests/test_engines_live.py -m live -q
      - name: Real end-to-end run against the adversarial harness
        run: |
          python -m blackheart engines run \
            --target harnesses/adversarial \
            --engines slither,wake,halmos,echidna,medusa \
            --allow-local --workdir /tmp/engrun
      - name: The run must confirm nothing on its own
        run: |
          python -c "import json; r=json.load(open('/tmp/engrun/engines-run.json')); c=[x for x in r['clusters'] if x['disposition']=='CONFIRMED']; assert not c, f'engines self-promoted {len(c)} findings'; print(f\"{len(r['clusters'])} clusters, 0 confirmed -- the gate holds\")"
      - name: Preserve the run as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engines-run
          path: /tmp/engrun/
          if-no-files-found: warn
