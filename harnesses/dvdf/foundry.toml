[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.23"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# Deterministic fuzzing: fixed seed so counterexamples reproduce exactly.
fuzz = { runs = 256, seed = "0x424c41434b4845415254" }
invariant = { runs = 256, depth = 64, fail_on_revert = false }
fs_permissions = [{ access = "read", path = "./out" }]
